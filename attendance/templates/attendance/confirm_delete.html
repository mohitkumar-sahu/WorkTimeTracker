{% extends 'attendance/base.html' %}

{% block title %}Confirm Delete - WorkTime Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 shadow-sm text-center">
            <div class="stat-icon bg-danger bg-opacity-10 text-danger mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <h4 class="fw-bold mb-2">Delete {{ type }} Record?</h4>
            <p class="text-muted mb-4">
                Are you sure you want to delete this {{ type }} record for <strong>{{ object.date }}</strong>? This action cannot be undone.
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2 flex-column flex-sm-row">
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 text-center">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 text-center">
                        <i class="bi bi-trash me-1"></i> Yes, Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
